name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install Node smoke dependencies
        run: npm install --no-save typescript@5.9.3

      - name: Install Tree-sitter CLI
        run: deno install -g -A npm:tree-sitter-cli@0.25.8

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Test
        run: deno task test

      - name: Runtime smoke
        run: deno run --allow-read --allow-write --allow-run tests/runtime_smoke.ts deno node bun

      - name: Publish dry run
        run: deno task publish:dry-run
