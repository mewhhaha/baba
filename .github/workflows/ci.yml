name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.94.0

      - uses: bytecodealliance/actions/wasm-tools/setup@v1

      - uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Install Tree-sitter CLI
        run: npm install --global tree-sitter-cli@0.25.8

      - name: Check independent Wasm tools
        run: |
          wasm-tools --version
          wasmtime --version
          tree-sitter --version

      - name: Test
        run: deno task test

      - name: Short deterministic fuzz seeds
        run: deno task test:fuzz

      - name: Bootstrap drift check
        run: deno task bootstrap:check

      - name: Embedded Wasm engine drift check
        run: deno task build:wasm-engine:check

      - name: Embedded grammar parser drift check
        run: deno task build:grammar-parser:check

      - name: Size budget check
        run: deno task size:check

      - name: Runtime size and cold-start budget check
        run: deno task bench:runtime -- --json runtime-bench-results.json

      - name: Publish dry run
        run: deno task publish:dry-run
