name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install Node smoke dependencies
        run: npm install --no-save typescript@5.9.3

      - name: Install Tree-sitter CLI
        run: npm install --global tree-sitter-cli@0.25.8

      - uses: bytecodealliance/actions/wasm-tools/setup@v1

      - uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Check independent Wasm tools
        run: |
          wasm-tools --version
          wasmtime --version

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Test
        run: deno task test

      - name: Exact TypeScript/Wasm parity gate
        run: deno task test:parity

      - name: BRL backend conformance gate
        run: deno task test:brl-conformance

      - name: Portable fixture and plan gates
        run: deno task test:portable

      - name: Tree-sitter acceptance gate
        run: deno task test:tree-sitter

      - name: Short deterministic fuzz seeds
        run: deno task test:fuzz

      - name: Bootstrap drift check
        run: deno task bootstrap:check

      - name: Deno Node Bun TypeScript and Wasm runtime smoke
        run: deno task test:runtime-smoke

      - name: Size budget check
        run: deno task size:check

      - name: Benchmark JSON smoke
        run: deno task bench -- --quick --samples 1 --json bench-results.json

      - name: Publish dry run
        run: deno task publish:dry-run
