name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.0

      - uses: bytecodealliance/actions/wasm-tools/setup@v1

      - uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Check independent Wasm tools
        run: |
          wasm-tools --version
          wasmtime --version

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Test
        run: deno task test

      - name: BRL backend conformance gate
        run: deno task test:brl-conformance

      - name: Short deterministic fuzz seeds
        run: deno task test:fuzz

      - name: Bootstrap drift check
        run: deno task bootstrap:check

      - name: Size budget check
        run: deno task size:check

      - name: Runtime size and cold-start budget check
        run: deno task bench:runtime -- --json runtime-bench-results.json

      - name: Publish dry run
        run: deno task publish:dry-run
