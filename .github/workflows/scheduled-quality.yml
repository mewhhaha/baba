name: Scheduled quality gates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  fuzz-and-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Deterministic fuzz seeds
        run: deno task test:fuzz

      - name: Runtime benchmark JSON report
        run: deno task bench:runtime -- --json runtime-bench-results.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            runtime-bench-results.json
