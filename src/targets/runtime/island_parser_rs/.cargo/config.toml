[build]
target = "wasm32-unknown-unknown"

[target.wasm32-unknown-unknown]
rustflags = [
  "-C",
  "panic=abort",
  "-C",
  "target-feature=+simd128",
  "-C",
  "link-arg=--export-memory",
  "-C",
  "link-arg=--initial-memory=131072",
  "-C",
  "link-arg=-zstack-size=32768",
  "-C",
  "link-arg=--no-entry",
]
