[build]
target = "wasm32-unknown-unknown"

[target.wasm32-unknown-unknown]
rustflags = [
  "-C",
  "panic=abort",
  "-C",
  "link-arg=--export-memory",
  "-C",
  "link-arg=--max-memory=4294901760",
  "-C",
  "link-arg=--initial-memory=2097152",
  "-C",
  "link-arg=-zstack-size=1048576",
  "-C",
  "link-arg=--no-entry",
]
